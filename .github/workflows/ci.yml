name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege for the automatic GITHUB_TOKEN. With no block here the job inherits the
# repository default, which on a personal account can still be read/write — a public repo's
# workflow that can write to the repo is a supply-chain hazard for the cost of two lines.
# This workflow only reads the checkout.
permissions:
  contents: read

jobs:
  build-test:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers; uname -m; xcodebuild -version; swift --version
      - name: Build
        # `set -o pipefail` is load-bearing: without it the pipeline reports tail's status, so a
        # failing build would pass CI silently. This workflow has never executed (ADR-0005), so
        # nothing has ever caught that.
        #
        # `-warnings-as-errors` because "0 warnings" was an unenforced claim until 2026-09-18, and
        # an unenforced claim is how it stopped being true: `swift build` exits 0 with warnings, and
        # an incremental local build only re-emits warnings for files it recompiles, so four
        # warnings — one of them a Swift 6 concurrency warning — sat in the tree while every local
        # run reported clean. CI builds from a fresh checkout, which is the one place this is
        # reliably measurable.
        run: |
          set -o pipefail
          swift build -v -Xswiftc -warnings-as-errors 2>&1 | tail -20
      - name: Unit tests
        run: |
          set -o pipefail
          swift test 2>&1 | tail -60
      - name: Entry-point documents in step
        # CLAUDE.md and AGENTS.md are one document for two tools. They have drifted three times,
        # once on a safety rule, each caught by a human noticing rather than by anything here.
        run: bash scripts/check-doc-mirror.sh
      - name: Privileged-helper invariants
        # The control for SECURITY_MODEL.md, checked over the files as committed. The editor hooks
        # that carry the same rules are a convenience and are bypassable several ways; this is not.
        run: bash scripts/helper-invariants.sh
      - name: Redaction helper tests
        # These guard xcv_redact, which every evidence file below is filtered through before it is
        # uploaded as a public artifact.
        run: bash scripts/experiments/test-common.sh
      - name: Lint (swift-format)
        # A lint that cannot fail is a lint that will eventually not run. Both arms of the old
        # `||` were green, so a missing formatter and real findings were indistinguishable from
        # clean. A missing formatter now fails the step: this is the control the PostToolUse hook
        # explicitly is not.
        run: |
          fmt=$(xcrun --find swift-format 2>/dev/null) || { echo "swift-format is not in this toolchain; the lint gate cannot run"; exit 1; }
          "$fmt" lint --recursive --strict --configuration .swift-format Sources Tests
      - name: Smoke test the CLI (read-only)
        run: |
          .build/debug/xcodevaultctl status
          .build/debug/xcodevaultctl xcode list
          .build/debug/xcodevaultctl compatibility
          # `report --json`, not `scan --json`: this file is uploaded as a public artifact, and
          # `report` is the command that redacts. On a GitHub runner the home is /Users/runner,
          # but the workflow should not depend on the runner being anonymous.
          .build/debug/xcodevaultctl report --json > scan.json && head -c 800 scan.json
          .build/debug/xcodevaultctl doctor || true
      - name: Read-only gating experiments (E1, E8) — evidence for the compatibility matrix
        run: |
          scripts/experiments/e1-mountability.sh
          scripts/experiments/e8-feature-detect.sh
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: |
            docs/research/evidence/e1-*.txt
            docs/research/evidence/e8-*.txt
            scan.json
          if-no-files-found: warn
