# SonarQube Cloud analysis. The organization key was verified against
# https://sonarcloud.io/api/organizations/search rather than assumed; the project key follows
# SonarCloud's `<org>_<repo>` convention for GitHub-imported projects and is auto-provisioned on
# the first CI analysis if it does not exist yet.
sonar.organization=pabloguia
sonar.projectKey=pabloguia_XCodeVault
sonar.projectName=XCodeVault

sonar.sources=Sources
sonar.tests=Tests
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# `.build` is SwiftPM's output and `fixtures/` is experiment input, not product code. Neither is
# authored here and neither should shape a quality measurement of what is.
sonar.exclusions=.build/**,fixtures/**,docs/**

# Swift needs no build wrapper or compilation database — that requirement is C/C++/Objective-C
# only. The analyzer reads source directly, which is why this runs on a Linux runner while the
# build-and-test matrix runs on macOS.

# swift:S1075 ("URIs should not be hardcoded") accounted for 110 of the first analysis's 141
# findings, and it is a domain mismatch here rather than a backlog. XCodeVault's subject *is* Apple's
# fixed tooling paths — `/Library/Developer/CoreSimulator`, `~/Library/Developer/Xcode/DerivedData`
# and the rest — so a literal path is the specification, not a shortcut.
#
# For the privileged helper it is stronger than that: safety rule 3 forbids the helper accepting
# arbitrary paths from its client, so `HelperMountHistory`'s root-owned store paths are hardcoded
# *because* making them configurable would be the vulnerability. Following this rule there would be
# a security regression, and the two findings it raises in that file are the clearest example.
#
# Measured before excluding, not assumed: the findings were sampled and every one was an Apple path.
sonar.issue.ignore.multicriteria=apple-paths
sonar.issue.ignore.multicriteria.apple-paths.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.apple-paths.resourceKey=**/*.swift
