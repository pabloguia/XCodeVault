    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="440" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#17A497"/>
      <stop offset="1" stop-color="#62E6CF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B0C2A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <circle cx="448" cy="512" r="276" fill="url(#door)"/>
  </g>
  <circle cx="448" cy="512" r="220" fill="none" stroke="#2B2D6E" stroke-opacity="0.16" stroke-width="16"/>
  <g fill="#2B2D6E" fill-opacity="0.5">
    <circle cx="448" cy="270" r="15"/><circle cx="448" cy="754" r="15"/><circle cx="206" cy="512" r="15"/>
    <circle cx="277" cy="341" r="15"/><circle cx="277" cy="683" r="15"/>
    <circle cx="619" cy="341" r="15"/><circle cx="619" cy="683" r="15"/>
  </g>
  <circle cx="448" cy="512" r="112" fill="#24265F"/>
  <g stroke="#8E95CC" stroke-width="9" stroke-linecap="round">
    <line x1="448" y1="418" x2="448" y2="442"/><line x1="448" y1="582" x2="448" y2="606"/>
    <line x1="354" y1="512" x2="378" y2="512"/>
    <line x1="382" y1="446" x2="399" y2="463"/><line x1="382" y1="578" x2="399" y2="561"/>
  </g>
  <!-- the dial's handle leaves the door: storage, moved out safely -->
  <path d="M 448 512 H 790" stroke="url(#accent)" stroke-width="60" stroke-linecap="round"/>
  <path d="M 724 424 L 820 512 L 724 600" fill="none" stroke="url(#accent)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
